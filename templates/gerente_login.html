<!doctype html>
<html lang="pt-br" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Gerente — ERPex</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
</style>
</head>
<body class="h-full bg-slate-50 text-slate-900 flex items-center justify-center">
  <div class="w-full max-w-sm bg-white border border-slate-200 rounded-xl p-8 shadow-sm">
    <h1 class="text-lg font-semibold mb-6 text-center">Área do Gerente</h1>
    {% if erro %}
    <div class="mb-4 text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2">{{ erro }}</div>
    {% endif %}
    <form method="post" action="/gerente/login" class="space-y-4">
      <div>
        <label class="block text-sm text-slate-600 mb-1">Senha</label>
        <input type="password" name="senha" autofocus required
               class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-800">
      </div>
      <button type="submit" class="w-full bg-slate-900 text-white rounded-lg py-2 font-medium hover:bg-slate-800">
        Entrar
      </button>
    </form>
  </div>
</body>
</html>
